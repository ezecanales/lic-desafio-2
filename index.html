<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="pagina">

    <!-- Barra superior -->
    <header class="barra-superior">
      <h1 class="marca">Mi Tienda</h1>

      <button type="button" class="carrito" id="btnCarrito" aria-label="Abrir carrito de compra">
        <svg class="carrito__icono" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
        <span class="carrito__total" id="totalCarrito">$0.00</span>
      </button>
    </header>

    <!-- Slider -->
    <section class="slider" id="slider" aria-label="Imágenes destacadas">
      <div class="slider__pista">
        <div class="slider__item activo">
          <div class="imagen-vacia imagen-vacia--grande"></div>
        </div>
        <div class="slider__item">
          <div class="imagen-vacia imagen-vacia--grande"></div>
        </div>
        <div class="slider__item">
          <div class="imagen-vacia imagen-vacia--grande"></div>
        </div>
      </div>

      <button type="button" class="slider__flecha slider__flecha--izq" data-accion="anterior" aria-label="Imagen anterior">&#10094;</button>
      <button type="button" class="slider__flecha slider__flecha--der" data-accion="siguiente" aria-label="Imagen siguiente">&#10095;</button>

      <div class="slider__puntos"></div>
    </section>

    <!-- Encabezado de productos -->
    <section class="filtros">
      <h2 class="filtros__titulo">
        Productos de la categoría: <span class="filtros__categoria" id="nombreCategoria"></span>
      </h2>

      <div class="filtros__controles">
        <label class="buscador">
          <svg class="buscador__icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="buscador" aria-label="Buscar producto por nombre">
        </label>

        <select class="selector-categoria" id="selectorCategoria" aria-label="Categoría">
          <option value="">Categoría</option>
        </select>
      </div>
    </section>

    <!-- Lista de productos -->
    <main class="productos" id="listaProductos"></main>

  </div>

  <script src="js/slider.js"></script>
</body>
</html>
