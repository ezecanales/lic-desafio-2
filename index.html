<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="pagina">

    <!-- Barra superior -->
    <header class="barra-superior">
      <h1 class="marca">Mi Tienda</h1>

      <button type="button" class="carrito" id="btnCarrito" aria-label="Abrir carrito de compra">
        <svg class="carrito__icono" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
        <span class="carrito__total" id="totalCarrito">$0.00</span>
      </button>
    </header>

    <!-- Slider -->
    <section class="slider" id="slider" aria-label="Imágenes destacadas">
      <div class="slider__pista">
        <div class="slider__item activo">
          <div class="imagen-vacia imagen-vacia--grande"></div>
        </div>
        <div class="slider__item">
          <div class="imagen-vacia imagen-vacia--grande"></div>
        </div>
        <div class="slider__item">
          <div class="imagen-vacia imagen-vacia--grande"></div>
        </div>
      </div>

      <button type="button" class="slider__flecha slider__flecha--izq" data-accion="anterior" aria-label="Imagen anterior">&#10094;</button>
      <button type="button" class="slider__flecha slider__flecha--der" data-accion="siguiente" aria-label="Imagen siguiente">&#10095;</button>

      <div class="slider__puntos"></div>
    </section>

    <!-- Encabezado de productos -->
    <section class="filtros">
      <h2 class="filtros__titulo">
        Productos de la categoría: <span class="filtros__categoria" id="nombreCategoria">Embutidos</span>
      </h2>

      <div class="filtros__controles">
        <label class="buscador">
          <svg class="buscador__icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="buscador" aria-label="Buscar producto por nombre">
        </label>

        <div class="selector">
          <select class="selector__campo" id="selectorCategoria" aria-label="Categoría">
            <option value="">Categoría</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Lista de productos -->
    <main class="productos" id="listaProductos"></main>

  </div>

  <!-- Modal: detalle del producto -->
  <div class="modal" id="modalDetalle" hidden>
    <div class="modal__caja modal__caja--detalle" role="dialog" aria-modal="true" aria-labelledby="detalleTitulo">
      <div class="imagen-vacia imagen-vacia--detalle" id="detalleImagen"></div>

      <div class="detalle__cabecera">
        <h3 class="detalle__titulo" id="detalleTitulo"></h3>
        <span class="detalle__precio" id="detallePrecio"></span>
      </div>
      <div class="estrellas" id="detalleEstrellas"></div>
      <p class="detalle__descripcion" id="detalleDescripcion"></p>
      <span class="etiqueta" id="detalleEtiqueta"></span>

      <div class="modal__botones modal__botones--centro">
        <button type="button" class="boton boton--borde" data-cerrar>Cancelar</button>
        <button type="button" class="boton boton--oscuro" id="btnAgregar">
          <svg class="boton__icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 9h2V6h3V4h-3V1h-2v3H8v2h3v3zm-4 9c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zm-9.83-3.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.86-7.01L19.42 4h-.01l-1.1 2-2.76 5H8.53l-.13-.27L6.16 6l-.95-2-.94-2H1v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.13 0-.25-.11-.25-.25z"/>
          </svg>
          Agregar
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: carrito de compra -->
  <div class="modal" id="modalCarrito" hidden>
    <div class="modal__caja modal__caja--carrito" role="dialog" aria-modal="true" aria-labelledby="carritoTitulo">
      <h3 class="carrito-modal__titulo" id="carritoTitulo">Carrito de Compra</h3>

      <div class="tabla-carrito">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Precio</th>
              <th>Cantidad</th>
              <th>Sub total</th>
            </tr>
          </thead>
          <tbody id="cuerpoCarrito"></tbody>
        </table>
      </div>

      <p class="carrito-modal__total">Total: <span id="totalModal">$0.00</span></p>

      <div class="modal__botones">
        <button type="button" class="boton boton--borde" data-cerrar>Cerrar</button>
        <button type="button" class="boton boton--oscuro" id="btnPagar">
          <svg class="boton__icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>
          </svg>
          Pagar
        </button>
      </div>
    </div>
  </div>

  <script src="js/slider.js"></script>
  <script src="js/tienda.js"></script>
</body>
</html>
